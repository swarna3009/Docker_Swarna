services:
  backend:
    build:
      context: .
      dockerfile: Dockerfilebackend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile-frontend
    ports:
      - "3000:3000"
    environment:
      API_URL: http://backend:8000/api
    depends_on:
      - backend